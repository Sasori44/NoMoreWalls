name: 定时同步订阅

on:
  schedule:
    - cron: "0 8 * * *"   # 每天8点执行
    - cron: "0 18 * * *"  # 每天16点执行
  workflow_dispatch:          # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 设置Python环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 运行同步脚本
        run: |
          python fetch.py

      - name: 提交并推送更新（如果需要）
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "定时同步更新"
          git push
        env:
          # 这里用 GitHub Token 来认证推送
          # 默认 GITHUB_TOKEN 自动注入，无需手动设置
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
